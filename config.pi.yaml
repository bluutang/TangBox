# =============================================================================
# TangBox - THE REAL CONFIG, for the Raspberry Pi
# =============================================================================
# This file is committed to git, so `git clone` on the Pi brings your channel
# lineup with it. On the Pi, make it the live config:
#
#     cp config.pi.yaml config.yaml
#     tangbox --check
#
# (config.yaml itself is gitignored, so each machine keeps its own live copy.
# The Mac has a different one, pointed at demo clips.)

# -----------------------------------------------------------------------------
# CHANNELS
# -----------------------------------------------------------------------------
# Numbers are pinned by hand ON PURPOSE. The alternative (media_root) discovers
# folders alphabetically and renumbers EVERY channel whenever you add a show -
# so channel 4 quietly becomes a different programme and the kids' muscle memory
# breaks. Tested and confirmed: adding "Blue's Clues" shifted Dragon Tales 3->4.
#
# Even numbers only, so 3/5/7/9 stay free for shows added later. Everything
# stays a single digit, which tunes instantly; double digits make the box wait
# a moment to see whether a second digit is coming.
#
# To add a show: make the folder, then add a block here with a free number.
# To rename one: change BOTH the folder name and `name` below.
# A CHANNEL IS A GROUP OF SHOWS, not a single show. `scan_recursive: true`
# (further down) sweeps every sub-folder, so a channel folder holds one folder
# per show and tuning in gives a random episode of any of them:
#
#     /media/tangbox/Pequenos/Pocoyo/S01E01.mp4
#     /media/tangbox/Pequenos/Plaza Sesamo/S01E01.mp4
#
# This matches the media spreadsheet, and it suits the audience - the kids are
# 2 and 4 and neither can read, so four tiles they can learn beats twenty-eight.
# The one-show-per-channel layout this replaced came from upstream placeholders;
# it was never chosen.
#
# PATHS ARE ASCII ON PURPOSE. macOS writes accented filenames decomposed (e plus
# a combining acute) while Linux expects them composed, so "Pequeños" typed here
# can silently fail to match the folder Finder actually made on the USB drive.
# `name:` is only ever drawn on screen, so it keeps its accents; `path:` has to
# survive two operating systems, so it doesn't have any.
#
# Lineup and per-show curation live in the spreadsheet:
# https://docs.google.com/spreadsheets/d/1fb_Xrny0GPkuBbcgE3VtzWoS1DsKUzRlx3RdoxrERIw/edit
channels:
  - number: 2
    name: "Los Pequeños"
    path: /media/tangbox/Pequenos
    # Pocoyo, Plaza Sesamo, Backyardigans, Las Tres Mellizas, Bob el
    # Constructor, Thomas, Barney, Los Lunnis. The 2-year-old's channel.

  - number: 4
    name: "Caricaturas"
    path: /media/tangbox/Caricaturas
    # Dora, El Chavo Animado, Los Picapiedra, Los Supersonicos, Don Gato,
    # David el Gnomo, Odisea Burbujas, Bizbirije. The 4-year-old's channel.
    #
    # Trim a run to the era you actually want. Seasons are detected from names
    # like S06E01, "Season 6" or 6x01. Uncomment to use:
    # exclude_seasons: ["6-25"]
    # exclude: ["*special*"]

  - number: 6
    name: "Cine"
    path: /media/tangbox/Cine
    # Totoro, Toy Story 1 & 2, Bichos, Nemo, Monsters Inc., Kiki, Lilo y Stitch.
    #
    # Films RESUME rather than starting part-way in. Without this override every
    # tune-in would drop you into the middle of a different film. Note the
    # position is held in memory only: it survives channel hopping but not
    # switching the box off, so a film started tonight begins again tomorrow.
    tune_in: resume

  - number: 7
    name: "Apple TV+"
    path: /media/tangbox/AppleTV
    # Stillwater / Lago tranquilo. Platform as the axis, which is the streaming
    # block ("7x") from docs/superpowers/specs/2026-08-20-channel-numbering-design.md
    # parked on a SINGLE digit: two-digit family blocks are the plan, but only
    # once the catalogue is big enough to be worth renumbering every channel.
    #
    # ONE show today, 16 episodes, so it will feel repetitive until it fills.
    # The Snoopy Show, Duck & Goose, Interrupting Chicken, Shape Island and
    # Frog and Toad are all Apple TV+ and all "Wanted" on the Lineup - they
    # belong in this folder when they arrive.
    #
    # Note this one is 1080p 16:9 and made in 2020, unlike every 4:3 rip
    # elsewhere on the box.

  - number: 8
    name: "En Inglés"
    path: /media/tangbox/Ingles
    # Dragon Tales, Mister Rogers, Arthur, The Magic School Bus.

# --- How a channel behaves when you tune in -----------------------------------
#   random    - a fresh random episode starts, a few seconds in  [chosen]
#   resume    - picks up where you left that channel last time
#   broadcast - the channel advances in real time even while you're not
#               watching, so you tune in partway through whatever "would" be
#               airing. The most authentic option. Try it once the box is in
#               the living room; it's a one-word change.
#
# This is the DEFAULT. Any channel can override it with its own `tune_in:` -
# useful when a film channel should resume while the TV channels run to a
# schedule:
#
#   - number: 10
#     name: "Movies"
#     path: /media/tangbox-movies/Family
#     tune_in: resume
#
# NOTE on resume: the position is remembered in memory only, so it survives
# channel hopping but NOT switching the box off. A film started tonight begins
# again tomorrow.
# CHOSEN 2026-08-25, after watching it on the television. `random` restarted a
# programme every time you landed on a channel, which is the one thing a real
# television never does - and it was what broke the illusion for Brian.
#
# `broadcast` runs each channel to a clock whether or not anybody is watching,
# so tuning in drops you partway through whatever "would" be airing.
#
# ⚠️ Broadcast builds its OWN running order - a single shuffle that loops - so
# it IGNORES `episode_order: sequential` below. The two cannot both apply. That
# is the price of the schedule, and it was paid knowingly.
tune_in: broadcast

start_channel: 2         # what it powers on to

# --- Sign-on ------------------------------------------------------------------
# How a TV station used to start the broadcast day: colour bars with the 1 kHz
# tone, then a station ident, then the first channel tunes in.
#
# OFF by default in the code (it changes the first thing anyone ever sees), ON
# here because it is the whole point of the box.
#
# ANY BUTTON SKIPS IT. That is deliberate and not optional: this plays every
# single time the box is switched on, in front of a 2- and a 4-year-old who
# want cartoons. A lovely twelve-second ident is charming on Tuesday and
# unbearable by Friday. Real station idents were short for the same reason.
#
# `logo` is a filename inside the assets folder. Until Brian's artwork lands,
# install.sh generates a placeholder - "TANGBOX" in phosphor green, fading up.
# To use the real thing: drop your own logo.mp4 into
# nostalgiabox/assets/ and restart. Nothing else changes, and
# `static_gen --force` deliberately will NOT overwrite it.
#
# It plays through the CRT shader, so it gets the scanlines and the phosphor
# bloom - bold shapes survive that, thin lines and small text do not.
sign_on:
  enabled: true
  # Must MATCH the length of assets/colorbars.mp4, which is a lead-in plus a
  # spin (scripts/make-spinner.py SPIN LEAD_IN, currently 8 + 8). The lead-in
  # covers the CEC wake and input switch - about nine seconds on the Samsung -
  # so the spin itself is still on screen when the picture finally arrives.
  bars_seconds: 16
  # Replay the ident when WAKING from standby too, not just at boot.
  # Starts AT the ident and skips the pre-roll - the set is already on.
  on_wake: true        # 0 = straight to the ident, no colour bars. Set to 2
                         # for the full broadcast-day open (bars + 1 kHz tone)
                         # if you ever want the longer version back.
  logo: logo.mp4

# --- The channel guide (press Home) -------------------------------------------
# A grid of every channel over the dimmed picture. The programme keeps playing
# underneath. Move with the d-pad, OK to tune, Back to leave without changing
# anything. Both numbers below were chosen on paper and have never been seen on
# a television - judge them from the sofa, not from a computer.
guide:
  timeout_seconds: 20    # closes itself after this long untouched, so a child
                         # who wanders off doesn't leave the telly dimmed under
                         # a menu all evening. 0 = stay open until closed.
  dim: 0.66              # how far the picture behind it dims. 0 = not at all,
                         # 1 = black. Lower it if the tiles get lost in a bright
                         # cartoon; raise it if the picture is distracting.
  page_cols: 2           # FOUR channels a page, not eight.
  page_rows: 2           # A 2x2 page keeps the tile PICTURE at 508x381 on
                         # screen however big the catalogue grows. A 4x2 page
                         # fits twice as many channels but drops the picture
                         # to 396x297 - and the picture is the only part of a
                         # tile a child who cannot read can use.
                         #
                         # The cost is pages: 24 channels is 6 pages here, 3
                         # at 4x2. Acceptable because the kids reach shows by
                         # picture and the random button, not by scanning.
                         # any shape that fits. Once the lineup outgrows a page
                         # the guide turns pages instead of shrinking the tiles,
                         # and a row of dots along the bottom shows which page
                         # you are on. Raise these to fit more per page at the
                         # cost of smaller names: 5 x 3 fits fifteen. A lineup
                         # small enough for one page ignores both and lays
                         # itself out square, as it always has.

# --- The "feel" of the TV -----------------------------------------------------
fullscreen: true         # true on the TV (this is the default)
force_4_3: false         # let 4:3 shows pillarbox and 16:9 fill the screen
start_offset: [6, 10]    # start a few seconds in, skipping black leader/intro

transition: static       # analog snow on channel change
transition_duration: 0.4
bridge_seconds: 0.8
channel_bug_seconds: 4   # how long the green channel banner lingers
osd_duration: 2

# --- On-screen display --------------------------------------------------------
ui:
  font: "VT323"
  color: "#4DFF5A"       # phosphor green
  dim_color: "#123B18"
  bold: false            # VT323 is a PIXEL font with no bold weight, so bold
                         # makes libass synthesise one by thickening every
                         # stroke - which smears a pixel font and reads as haze.
                         # This, not the blur, was why the text looked soft
                         # through glow_blur 4, 2, 1 and 0 on the TV.
  letter_spacing: 4      # VT323 sets tightly. Opening it up stops adjacent
                         # strokes merging at ten feet - it reads as crisper
                         # before it reads as wider. Judge on the TV.
  glow: true
  glow_blur: 0.5         # 4 -> 2 -> 1 -> 0 -> 0.5, each judged on the TV. The
                         # haze was bold, not this - a little bloom is character.
                         # (2026-08-19), and 4 was chosen on a computer. The
                         # overlay is drawn on a 1280x720 canvas and stretched,
                         # so the blur lands 1.5x wider on a 1080p screen than
                         # it looks anywhere else - the same trap that took
                         # scanline_intensity from 0.12 to 0.03.
                         #
                         # JUDGE THIS ON THE TELEVISION, not a laptop. Try 1 if
                         # still soft, 0 for crisp text that keeps the green
                         # edge, or back to 4 for the original bloom.
                         # `glow: false` is different - it drops the green edge
                         # entirely for a plain black outline.

# --- CRT picture effect -------------------------------------------------------
crt:
  enabled: true
  curvature: 0.18          # "Glass & Grain": a bend you feel, not one you see
  corner_radius: 0.075
  vignette: 0.38
  scanlines: true
  scanline_intensity: 0.26
  # RAISED 2026-08-25, after the first proper viewing on the television. The
  # previous numbers (0.04 / 0.17 / 0.03) came with a warning to "raise gently
  # if at all", written from a computer monitor. From the sofa the opposite was
  # true: three metres from a 55" panel, the whole ladder read as too subtle
  # and the gentlest rungs were hard to tell from no shader at all.
  #
  # Judge this rung on the television, never on a laptop - that is the mistake
  # the old comment encoded.
  #
  # Raised a second time the same day. The first raise was judged against a
  # STALE COPY of the code: the box was running nostalgiabox from the venv's
  # site-packages, not the repo, so the SOFT and HEAVY rungs on screen were
  # still the old numbers while this rung (config, not code) had moved. The Pi
  # is on an editable install now.
  #
  # ⚠️ `vignette` has a hard ceiling at 0.5 - the shader darkens the corners by
  # `vignette * 2`, so 0.5 is exactly black there and beyond it a growing ring
  # of picture clips away. Nothing warns you.

# --- Audio --------------------------------------------------------------------
initial_volume: 60
volume_step: 5

# Pinned deliberately, not autodetected. Read off this Pi with
# `tangbox --list-audio` on 2026-08-19, so it is the real device string rather
# than a guess. Use vc4hdmi1 if you ever move to the second HDMI port (this
# project uses HDMI0, nearest the power plug).
#
# Why pin it: as a boot-time service the box has no login session, so
# /run/user/1000 does not exist and the audio server fails with
# "Failed to create secure directory (/run/user/1000/pulse)". Naming the ALSA
# device sends mpv straight at the HDMI output and skips that entirely.
#
# NOT YET CONFIRMED BY EAR - the TV is in another room. Ten-second check.
audio_device: "alsa/hdmi:CARD=vc4hdmi0,DEV=0"

# --- Display mode -------------------------------------------------------------
# Which HDMI mode mpv sets when it takes the screen.
#
# THIS TV IS 4K, AND THAT IS WORSE, NOT BETTER. Left alone, mpv picks the
# connector's PREFERRED mode - 3840x2160@30 here - and it wins over anything the
# kernel was told on the cmdline. Proven 2026-08-19: stopping TangBox dropped the
# display straight back to the pinned 1920x1080@60, so it was mpv all along.
#
# Why less is more for this box:
#   * These are 480-line cartoons. You cannot upscale into detail the source
#     never had; 4K just scales the same pixels further.
#   * 1080p60 is twice the refresh of 4Kp30, and motion is what you notice.
#   * The OSD is drawn on a 1280x720 canvas. At 4K it is stretched 3x; at 1080p
#     only 1.5x. That, not the blur, is most of why the HUD text looked soft.
#   * The GPU stops running the CRT shader over four times the pixels.
#
# 'preferred' or 'highest' also work if you ever want mpv to choose.
display_mode: "1920x1080@60"

# Volume-down again at zero would cleanly power the Pi off.
#
# OFF since 2026-08-22. It is far too easy to hit by accident: a 2- and a
# 4-year-old holding down volume-down until it stops is exactly the shape of
# this gesture, and a halted Pi cuts USB power, so the remote cannot switch it
# back on. Losing the television for the evening is a much worse outcome than
# having one fewer way to shut down.
#
# The deliberate ways to switch off remain: the bedtime button, the onboard
# button on the Pi itself, and POWER if power_button is set to "shutdown".
power_off_on_min_volume: false

# What the remote's POWER button does. "standby" just blanks the screen and
# leaves the Pi running; "shutdown" plays the sign-off collapse, tells the
# television to switch off, and halts the machine properly.
#
# Brian's decision, 2026-08-20: off should mean off. TangBox is a box you
# switch on for a session, not an always-on appliance.
#
# ⚠️ Accepted trade: a halted Pi cuts power to its own USB ports, so the Flirc
# receiver stops listening. The remote can switch the box OFF but NEVER back
# on - that needs the Pi's onboard button or the inline switch, both of which
# live behind the television.
power_button: standby

# Where the bedtime sign-off ENDS. "shutdown" halts the Pi; "standby" plays the
# same collapse and simply goes quiet.
#
# STANDBY since 2026-08-22, and the reason is the four-year-old. ✱ is a button
# on a remote she can reach, and a halted Pi cuts its own USB power, so the
# Flirc stops listening and only the button on the board brings it back. An
# accidental press at four in the afternoon would cost the television for the
# rest of the day.
#
# Standby keeps the entire ritual - the countdown at 15/10/5/3/2/1, the CRT
# collapse - and only changes what is left afterwards: a quiet box that POWER
# wakes, rather than a dead one.
#
# ⚠️ The trade: the Pi stays powered, and this case's RGB is wired to run
# whenever the Pi has power, so the box glows all night. If that turns out to
# be annoying in a dark living room, set this back to "shutdown" and use the
# onboard button to switch it on in the morning.
bedtime_ends_in: standby

# Play the sign-off collapse when POWER goes to standby too, so switching
# off is as much of an event as switching on. ✱ always plays it regardless.
sign_off_on_standby: true

# No STANDBY card once the box has gone quiet - the sign-off's last frame
# is the last thing on screen. Safe here because the television switches
# itself off when the signal stops.
standby_notice: false

# How long the clip is given. The mirrored ident sign-off - letters sliding
# back behind the orange, then the orange collapsing to a dot - runs ~3.8s.
# The old hard-coded 1.1 cut it off after a second.
sign_off_seconds: 4.0

# Told to the television just before the Pi halts, after the collapse has
# played. CEC is switched off for INPUT (the box ignores the TV's own remote,
# which is deliberate) but sending is a separate direction, and the box already
# proved it can talk this way - announcing itself as active source is the same
# channel with a different command.
#
# Best-effort: if this fails or hangs, the Pi still halts. A telly that will
# not switch off is worse than one whose screen stays on for a moment.
#
# ⚠️ UNVERIFIED ON THIS HARDWARE. Sending 'as' is proven on the Samsung;
# 'standby 0' is the same mechanism but nobody has run it. Check it the first
# time the box is shut down from the remote, and set this to [] if it misbehaves.
tv_standby_command: ["sh", "-c", "echo 'standby 0' | cec-client -s -d 1 -o TangBox"]

# Run when the box comes back ON - waking from standby, and at start-up.
#
# Two CEC messages, and the SECOND is the one that matters: `on 0` powers the
# television, `as` (active source) makes it switch to THIS input. Powering a
# television on is little use if it lands on the wrong HDMI socket.
#
# This is what makes switching the television off on standby safe: without a
# way back, POWER would wake the box to a dark screen.
#
# `-o TangBox` sets the name the box announces on the CEC bus. Without it
# libCEC calls itself "CECTester", which is what a Samsung shows when it
# switches source.
#
# ✅ The CEC BUS was verified 2026-08-24 by scanning it from the Pi with the
# television in standby: the Samsung answers (so Anynet+ is already on),
# cec-client is installed, /dev/cec0 exists, and the Pi sits at address
# 3.0.0.0 - HDMI 3. A PlayStation 5 is on HDMI 1.
# ⚠️ The COMMANDS themselves have still never been sent.
# Empty means "leave the television alone", which is the code default.
# The `sleep 2` is LOAD-BEARING. On the Pi the CEC adapter belongs to the HDMI
# driver, and mpv starting or restarting playback resets the output - which
# kills an in-flight cec-client session. Without the delay the wake command
# logs "opening a connection to the CEC adapter" and the television never
# wakes. Proven on the set 2026-08-24: identical command works from a shell.
tv_wake_command: ["sh", "-c", "sleep 2; echo 'on 0' | cec-client -s -d 1 -o TangBox; echo 'as' | cec-client -s -d 1 -o TangBox"]

# --- Commercial breaks --------------------------------------------------------
# When an episode ends, the station goes to break before the next one starts.
# Drop advert clips into the folder below - the leading underscore keeps it from
# being mistaken for a channel.
#
# Breaks are built by LENGTH, not by count: adverts of the era run anywhere from
# 15 to 60 seconds, so "play three ads" would give a 45-second break one time and
# a three-minute one the next. Filling a target duration instead lands naturally
# on two or three clips.
#
# Every advert plays once before any repeats, and never twice in a row.
# An empty or missing folder means no breaks at all - the box behaves exactly as
# it did before this existed. Set enabled:false to switch it off without moving
# the files.
# Clips in the ROOT of this folder are the generic pool: period advertising any
# channel could have run. Each SUBFOLDER is a network, and a channel naming one
# (`commercials: Nickelodeon` on the channel) draws from those bumps AS WELL AS
# the generic pool - not instead of it. There are nine Nickelodeon bumps against
# sixty-odd generic adverts, so bumps alone would come round every few breaks;
# and real Nickelodeon ran its bumps between the same cereal and toy adverts
# everybody else was running.
#
# A channel naming no network, or a network with no folder, quietly gets the
# generic pool - so a typo here costs a channel its bumps, never its adverts.
commercials:
  path: /media/tangbox/_commercials
  break_seconds: 75
  # Break length follows the programme. `break_seconds` is the FLOOR, and a
  # longer episode earns roughly this fraction of its own length in adverts.
  # 0.18 is the ratio a 75s break has to a seven-minute cartoon segment, so a
  # twenty-minute episode gets about three and a half minutes.
  #
  # This is also what makes a long advert usable at all: a clip is only ever
  # chosen when it fits the time the break has LEFT, so a two-minute clip can
  # air after a full episode and never after a short one. Leave it at 0 and
  # every break is exactly `break_seconds`, as it was before this existed.
  break_ratio: 0.18
  # A HARD CEILING on a break, whatever the ratio asks for. Measured on the box
  # 2026-08-25: breaks were running 2:21 to 4:43, and the long tail was the
  # problem rather than the typical length.
  #
  # Note this clamps the OVERSHOOT allowance too, not just the target - a break
  # is otherwise allowed to run over by up to break_seconds, which would have
  # carried it to five minutes through a 3:45 ceiling.
  #
  # 0 turns it off. For scale, a real broadcast half-hour carried six to eight
  # minutes of advertising, so even this is gentler than the thing it imitates.
  break_max_seconds: 225
  enabled: true

# --- Playback -----------------------------------------------------------------
scan_recursive: true     # look inside season sub-folders too

# --- Remote control -----------------------------------------------------------
# The Flirc is the remote for this box. It appears to Linux as an ordinary USB
# keyboard, so it arrives through the `keyboard` backend.
#
# CEC is OFF ON PURPOSE, and this is a choice rather than a limitation.
# Tested on the Samsung 2026-08-19: CEC works fully. The TV forwards up, down,
# left, right and select to the Pi - but only once the box announces itself as
# the active source, which cec.py never does. Brian chose a dedicated remote so
# the kids cannot land in the TV's own menus, so the TV remote is deliberately
# cut off here.
#
# This ONE switch is total separation. Verified the same night that CEC keys do
# NOT also arrive as evdev events: 0 events on vc4-hdmi-0/1 while cec-client
# logged 26 for the same presses. There is no second route in.
#
# Turning `cec: true` back on is NOT enough to make the TV remote work - cec.py
# has three real bugs (no active-source announcement, wrong libCEC log level,
# and a double-event duplicate). The session wrap has the diagnosis and fixes.
input:
  keyboard: true
  cec: false
  stdin: false

  # Once the Flirc is plugged in, restrict the keyboard backend to it by name.
  # Without this the backend also binds vc4-hdmi-0, vc4-hdmi-1 and pwr_button -
  # the Pi's own power button ends up wired into the remote control system,
  # which nobody intended. Read the real name first:  cat /proc/bus/input/devices
  # keyboard_name_filter: "flirc"
